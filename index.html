<!DOCTYPE html>
<html lang="ca">
<head>

<title>El cos humà · Bloom (prova M1.1)</title>
<style>
:root{--bg:#f4efe6;--ink:#2b2622;--mut:#8a8076;--line:#e2d8c8;--acc:#c0563b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}
aside{background:#1d1b19;color:#eee;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.brand{background:#efe7da;color:#222;border-radius:10px;padding:10px 12px}
.brand b{font-size:16px}.brand div{font-size:12px;color:#666;margin-top:2px}
.vid{position:relative;width:100%;aspect-ratio:4/3;background:#2a2725;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px}
.vid canvas{position:absolute;inset:0;width:100%;height:100%}
button{font:inherit;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;background:#3a3633;color:#eee}
button.pri{background:var(--acc);color:#fff;font-weight:600}
button.on{background:#efe7da;color:#222;font-weight:600}
.row{display:flex;gap:6px}.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gest{font-size:12px;color:#bbb;line-height:1.75;background:#262321;border-radius:8px;padding:8px 10px}
.gest i{font-style:normal;color:#fff}
label.sl{font-size:12px;color:#aaa;display:block;margin-bottom:2px}
input[type=range]{width:100%;accent-color:var(--acc)}
.lang button{padding:6px 4px;font-size:13px}
.msg{font-size:12px;color:#f0b49c;min-height:14px}
main{position:relative;overflow:hidden;display:flex;flex-direction:column}
svg#stage{flex:1;width:100%;min-height:0;display:block;touch-action:none;user-select:none}
.hud{position:absolute;top:10px;right:10px;background:rgba(255,250,242,.92);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;color:#555}
.hud .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#bbb;margin-right:6px;vertical-align:1px}
.hud .dot.on{background:#2e8b57}
.quiz{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:22px;padding:8px 18px;font-size:16px;display:none;white-space:nowrap;z-index:3}
.quiz b{color:#ffd28a}.quiz small{opacity:.7;margin-left:10px}
.foot{text-align:center;padding:4px 10px 10px}
.foot h2{margin:0;font-size:21px}.foot p{margin:3px 0 8px;font-size:13px;color:var(--mut);min-height:17px}
.lessons{display:inline-flex;gap:8px;background:#fffaf2;border:1px solid var(--line);border-radius:14px;padding:6px}
.lessons button{background:#fff;color:#333;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:86px;font-size:11px}
.lessons button span{font-size:22px}
.lessons button.on{border:2px solid #222;background:#fff}
.bins{position:absolute;left:0;right:0;bottom:118px;display:none;justify-content:center;gap:14px;pointer-events:none;z-index:2}
.bin{width:170px;height:66px;border-radius:14px;border:3px dashed;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:rgba(255,255,255,.75);transition:transform .15s}
.bin.hot{transform:scale(1.08);background:#fff}
.bin.ok{background:#d9f2df}.bin.bad{background:#fbd9d9;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.f{fill:var(--f);stroke:var(--s);stroke-width:2;stroke-linejoin:round}
.m{fill:var(--f);stroke:var(--s);stroke-width:3;stroke-linejoin:round}
.h{fill:#4a3f36;opacity:.8}
.part{cursor:grab}
.part.ok{filter:drop-shadow(0 0 10px #2e8b57)}
.part.bad{filter:drop-shadow(0 0 10px #d33)}
.part.hold{filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.part.done{opacity:.3}
.card rect{stroke-width:1.5}
.card .n{font-size:15px;font-weight:600;fill:#2b2622}
.lead{stroke:#5d5853;stroke-width:1.1;fill:none}.ldot{fill:#3a3532}
.fib{fill:url(#fib);stroke:none;pointer-events:none}
.fab{display:none;position:absolute;right:12px;width:46px;height:46px;border-radius:50%;align-items:center;justify-content:center;font-size:20px;z-index:4;background:#2b2622;color:#fff;padding:0}
#fabCam{bottom:182px}#fabMenu{bottom:128px}
.card .d{font-size:12px;fill:var(--mut)}
.rl{font-size:28px;font-weight:800;paint-order:stroke;stroke:#f4efe6;stroke-width:6px;text-anchor:middle}
@media(max-width:820px){
 .app{display:block;height:100dvh}main{height:100dvh}
 aside{position:fixed;left:0;right:0;bottom:0;max-height:78dvh;transform:translateY(102%);transition:transform .25s;z-index:10;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
 body.sheet aside{transform:none}
 .brand{display:none}.fab{display:flex}
 main .vid{position:absolute;top:10px;left:10px;width:118px;z-index:6;display:none;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
 body.camon main .vid{display:flex}
 .foot{padding:2px 6px 8px}.foot h2{font-size:17px}.foot p{font-size:12px;margin-bottom:6px}
 .lessons{gap:4px;padding:4px}.lessons button{min-width:66px;padding:5px 4px;font-size:10px}.lessons button span{font-size:18px}
 .bins{bottom:112px;gap:6px}.bin{width:30vw;height:52px;font-size:13px;border-width:2px}
 .quiz{font-size:14px;padding:6px 12px;top:54px}.hud{font-size:11px;padding:4px 9px}
}
</style>

async function openCam(id){if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());
  const c=id?{deviceId:{exact:id},width:640,height:480}:{width:640,height:480,facingMode:'user'};
  const st=await navigator.mediaDevices.getUserMedia({video:c});video.srcObject=st;await video.play();return st}
const CAMHELP={ca:'Tanca OBS / Teams / Zoom (poden bloquejar la càmera), tria una altra càmera a la llista i torna-ho a provar.',es:'Cierra OBS / Teams / Zoom (pueden bloquear la cámara), elige otra cámara en la lista y vuelve a probar.',zh:'请关闭 OBS / Teams / Zoom 等占用摄像头的程序，在下拉菜单选另一个摄像头，再点一次按钮。',en:'Close OBS / Teams / Zoom (they can lock the camera), pick another camera in the list and try again.'};
async function fillSel(now){let ds=[];try{ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){}
  const sel=document.getElementById('camSel');if(!ds.length){sel.style.display='none';return ds}
  sel.innerHTML=ds.map((d,i)=>`<option value="${d.deviceId}" ${d.deviceId===now?'selected':''}>📷 ${d.label||('Camera '+(i+1))}</option>`).join('');
  sel.style.display='block';
  sel.onchange=()=>{if(!cam.on){document.getElementById('camBtn').click();return}openCam(sel.value).catch(e=>{msg.textContent='⚠ '+e.name+': '+e.message+' — '+CAMHELP[lang]})};
  return ds}
async function pickCam(){const ds=await fillSel(null);
  const cur=video.srcObject.getVideoTracks()[0],curLabel=cur&&cur.label||'',curId=cur&&cur.getSettings().deviceId;
  if(VIRT.test(curLabel)){const real=ds.find(d=>d.label&&!VIRT.test(d.label));if(real){try{await openCam(real.deviceId)}catch(e){msg.textContent='⚠ '+real.label+': '+e.name;await openCam(curId)}}}
  await fillSel(video.srcObject.getVideoTracks()[0].getSettings().deviceId)}
let lastDet=0,errN=0,cal={lo:1.15,hi:1.6};
async function detErr(e){errN++;const t='⚠ '+(e&&e.message||e);cam.status=t;document.getElementById('hud').textContent=t;
  if(cam.dev==='GPU'&&cam.vision){const old=cam.lm;cam.lm=null;cam.dev='CPU';try{cam.lm=await cam.vision.HandLandmarker.createFromOptions(cam.fs,cam.opt('CPU'));try{old.close()}catch(_){}}catch(e2){cam.status='⚠ '+(e2&&e2.message||e2)}}}
function detect(){
  if(video.readyState<2)return;const ts=performance.now();if(ts<=lastTs)return;lastTs=ts;
  const res=cam.lm.detectForVideo(video,ts),W=cv.width,H=cv.height;
  ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,W,H);
  const hands=(res.landmarks||[]).map(l=>{ctx.fillStyle='rgba(255,255,255,.85)';l.forEach(p=>{ctx.beginPath();ctx.arc(p.x*W,p.y*H,3,0,7);ctx.fill()});
    const palm=D(l[0],l[9])||1e-3;return{l,x:1-l[9].x,open:[8,12,16,20].reduce((s,i)=>s+D(l[0],l[i]),0)/4/palm,rest:[12,16,20].reduce((s,i)=>s+D(l[0],l[i]),0)/3/palm,pin:D(l[4],l[8])/palm}});
  ctx.restore();
  const isPinch=h=>!L.custom&&h.rest>cal.lo+.45*(cal.hi-cal.lo)&&h.pin<(pinching?0.45:0.33);
  let ctrl=null,ptr=null;
  if(hands.length>=2){hands.sort((a,b)=>a.x-b.x);ctrl=hands[0];ptr=hands[1]}else if(hands.length===1){isPinch(hands[0])?ptr=hands[0]:ctrl=hands[0]}
  const u=T[lang],hud=[];
  if(ctrl){const r=ctrl.open;cal.lo+=(1.15-cal.lo)*.002;cal.hi+=(1.6-cal.hi)*.002;cal.lo=Math.min(cal.lo,r);cal.hi=Math.max(cal.hi,r);if(cal.hi-cal.lo<.35)cal.hi=cal.lo+.35;
    const t=Math.min(1,Math.max(0,(r-cal.lo-.06)/((cal.hi-cal.lo)*.82)));ema.open+=(t-ema.open)*.35;
    if(mode==='explora'){tgtT=ema.open;sl.value=tgtT}
    hud.push(u.L+' '+(ema.open<.1?u.fist:u.open+' '+Math.round(ema.open*100)+'%'));
    const c=ctrl.l[9];ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText(Math.round(curT*100)+'%',(1-c.x)*W-22,c.y*H-40);
  }else hud.push(u.L+' '+u.none);
  if(ptr&&!L.custom){const vb=svg.viewBox.baseVal,tip=ptr.l[8],th=ptr.l[4];
    const nx=1-(tip.x+th.x)/2,ny=(tip.y+th.y)/2,sx=vb.x+(nx-.1)/.8*vb.width,sy=vb.y+(ny-.1)/.8*vb.height;
    if(ema.px===null){ema.px=sx;ema.py=sy}ema.px+=(sx-ema.px)*.45;ema.py+=(sy-ema.py)*.45;
    cursor.setAttribute('cx',ema.px);cursor.setAttribute('cy',ema.py);cursor.setAttribute('opacity',1);
    const p=isPinch(ptr);
    if(p&&!pinching){pinching=true;grab(ema.px,ema.py)}else if(p&&pinching)move(ema.px,ema.py);else if(!p&&pinching){pinching=false;release()}
    cursor.setAttribute('fill',pinching?'rgba(192,86,59,.35)':'none');hud.push(u.R+' '+(pinching?u.pinch:u.point));
  }else{cursor.setAttribute('opacity',0);if(pinching){pinching=false;release()}ema.px=null;if(!L.custom)hud.push(u.R+' '+u.none)}
  document.getElementById('hud').textContent=(hands.length?'✋'+hands.length+' · '+hud.join(' · '):'🔍 '+HINT[lang])+' · '+cam.dev+' · v8';
}
